# ESP Nest — ESPHome feasibility spike, variant B.
# ESPHome provides the platform (WiFi, native API, OTA, safe mode, HA
# entities); the display pipeline, LVGL 9.6 and the encoder are owned by the
# nest_display external component, rendering in its own task on core 1.

esphome:
  name: esp-nest-spike
  friendly_name: ESP Nest (spike B)

esp32:
  variant: esp32s3
  flash_size: 16MB
  flash_mode: qio
  cpu_frequency: 240MHz
  # Byte-identical copy of the native firmware's table (OTA-in migration).
  partitions: partitions.csv
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_key
  # Accepts ANY .bin from a browser/curl — the way back to native firmware.
  - platform: web_server

web_server:
  port: 80

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "ESP Nest Fallback"

captive_portal:

external_components:
  - source:
      type: local
      path: components

nest_display:
  # true: X mirror in the ST7701S (SDIR) + row-order flip in flush (memcpy
  # per row). false: per-pixel 180° copy exactly like the native firmware.
  hw_mirror_x: false
