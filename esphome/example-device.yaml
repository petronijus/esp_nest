# ESP Nest — Home Assistant Device Builder configuration.
#
# Paste this into the Device Builder as the device's YAML. The package is
# pinned to an immutable release tag, never a branch: bump the tag to
# update. Secrets come from Home Assistant's secrets.yaml; their names are
# listed in secrets.example.yaml. scripts/check.sh (smoke step) validates
# this file with the package taken from a git clone of the tree.

substitutions:
  name: esp-nest
  friendly_name: ESP Nest
  # The external devices on the MQTT broker. The package defaults are
  # generic placeholders: set every one to your own entity names, or the
  # knob talks to topics nothing listens on.
  topic_lights: zigbee2mqtt/lights            # zigbee2mqtt light or group
  topic_fan: home/fan                         # retained Off/low/medium/high
  topic_stereo_vol: home/stereo/volume        # UP/DOWN on <topic>/set
  topic_blinds_prefix: blinds/cover           # ESPHome RF cover bridge
  blinds_group_a: group_a                     # covers <prefix>/<group>_{1..3}
  blinds_group_b: group_b
  # On-screen labels of the two blinds groups (the package default is
  # "A" / "B"). Every character must have a glyph in the label font:
  # printable ASCII and ÁÉÍÓÚÝŠŽáéíóúýšž (no ČĎĚŇŘŤŮ), no leading or
  # trailing spaces; the esp_nest component rejects anything else.
  # blinds_label_a: "Living"
  # blinds_label_b: "Bedroom"

packages:
  esp_nest: github://petronijus/esp_nest/esphome/esp-nest.yaml@v3.0.0
