# ESP Nest — ESPHome feasibility spike.
# Goal: prove display init (our exact ST7701S sequence), 180° rotation,
# encoder + button, backlight, and raw-LVGL C/C++ UI code living in an
# external component, and measure render performance on real hardware.

esphome:
  name: esp-nest-spike
  friendly_name: ESP Nest (spike)

esp32:
  variant: esp32s3
  flash_size: 16MB
  flash_mode: qio
  # Byte-identical copy of the native firmware's table: the device keeps its
  # IDF 5.5.3 bootloader + this table when the app arrives over OTA.
  partitions: partitions.csv
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_key
  # Allows uploading ANY .bin from a browser — the way back to the
  # native firmware if the spike is abandoned.
  - platform: web_server

web_server:
  port: 80

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "ESP Nest Fallback"

captive_portal:

external_components:
  - source:
      type: local
      path: components

spi:
  - id: init_spi
    interface: software
    # SPI is only used for the ST7701S init sequence, then released; both
    # pins become RGB data pins afterwards (see main/screen.c).
    clk_pin:
      number: 47
      allow_other_uses: true
    mosi_pin:
      number: 41
      allow_other_uses: true

display:
  # Upstream ESPHome model for this exact board — same pins, porches and
  # ST7701S init sequence as main/screen.c.
  - platform: mipi_rgb
    id: round_display
    model: ZX2D10GE01R-V4848
    spi_id: init_spi
    # The native firmware runs with the esp_lcd default (not inverted);
    # the upstream model defaults to inverted — verify both on hardware.
    pclk_inverted: false
    update_interval: never
    auto_clear_enabled: false

output:
  - platform: ledc
    id: backlight_pwm
    pin: 38
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

sensor:
  - platform: rotary_encoder
    id: knob
    pin_a: 5
    pin_b: 6
    resolution: 2

binary_sensor:
  - platform: gpio
    id: knob_button
    pin:
      number: 3
      inverted: true
      mode:
        input: true
        pullup: true

lvgl:
  displays: [round_display]
  rotation: 180
  buffer_size: 25%
  log_level: WARN
  encoders:
    sensor: knob
    enter_button: knob_button
  # Widgets declared here only so ESPHome compiles the matching LVGL
  # features in; the probe component draws the actual stress scene.
  widgets:
    - arc:
        id: feature_arc
        hidden: true
    - label:
        id: feature_label
        hidden: true
        text: ""

nest_probe:
