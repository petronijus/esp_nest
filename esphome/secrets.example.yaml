# Secret names of the ESP Nest ESPHome build. Names only — never commit values.
#
# Locally the real file is esphome/secrets.yaml (gitignored), written by
# scripts/secrets-decrypt.sh from the SOPS-encrypted private overlay
# (private/config/esphome-secrets.yaml.sops; edit it with
# `scripts/secrets-edit.sh esphome`). In the HA Device Builder these keys go
# into Home Assistant's secrets.yaml. scripts/check.sh builds its dummy
# secrets from this list, so every name the package uses must be here.

# WiFi network (shared with the native firmware's secrets.defaults).
wifi_ssid: "<WiFi SSID>"
wifi_password: "<WiFi password>"

# Native API encryption key, also used for the encrypted ESPHome OTA:
# 32 random bytes, base64 (openssl rand -base64 32).
esp_nest_api_key: "<base64 32-byte key>"

# Password of the "ESP Nest Fallback" access point (at least 8 characters).
esp_nest_fallback_password: "<fallback AP password>"

# Basic auth of the web server, which also guards POST /update.
esp_nest_web_username: "<web server user>"
esp_nest_web_password: "<web server password>"

# MQTT broker of the external devices (zigbee2mqtt lights, fan, stereo,
# blinds); shared with the native firmware's secrets.defaults. The broker is
# a host name or IP address only, without mqtt:// and port (1883).
mqtt_broker: "<broker host>"
mqtt_username: "<MQTT user>"
mqtt_password: "<MQTT password>"
