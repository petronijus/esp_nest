name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The ESPHome package — what Home Assistant builds from this tag — must
  # pass the same gate as locally (scripts/check.sh), minus the dev entry,
  # which needs the private overlay. No binary is published: the HA Device
  # Builder compiles the package with the user's own secrets.
  esphome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install ESPHome (pinned, same as the HA Device Builder)
        run: |
          uv tool install "esphome==$(sed -n 's/^ESPHOME_VERSION="\(.*\)"$/\1/p' scripts/check.sh)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ runner.os }}-${{ hashFiles('scripts/check.sh') }}

      - name: Gate (secrets, host tests, ESPHome config + compile + partition table, HA smoke test)
        env:
          CHECK_DEV_ENTRY: "0"
        run: scripts/check.sh secrets host esphome smoke

  build:
    needs: esphome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          command: |
            idf.py build
            cd build && esptool.py --chip esp32s3 merge_bin -o factory.bin @flash_args

      - name: Prepare release assets
        run: |
          TAG=${GITHUB_REF_NAME}
          cp build/ZX2D10GE01R.bin "esp_nest-${TAG}-ota.bin"
          cp build/factory.bin "esp_nest-${TAG}-factory.bin"
          sha256sum esp_nest-${TAG}-*.bin > sha256sums.txt

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release create "$TAG" --verify-tag --generate-notes || true
          gh release upload "$TAG" esp_nest-${TAG}-*.bin sha256sums.txt --clobber
